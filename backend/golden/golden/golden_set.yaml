# Golden set: 20 пар «компания × событие» с эталонными ожиданиями.
#
# Состав выбран намеренно: восемь пар, где система обязана сработать,
# восемь, где обязана промолчать, и четыре ловушки — случаи, где наивная
# реализация сработает, а правильная откажется. Ловушки ценнее всего:
# именно они отличают продукт от новостной ленты с пересказом.
#
# Все компании и все их показатели взяты из витрины, не выдуманы.

