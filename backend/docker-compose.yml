version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Монтируем папку frontend из корня проекта внутрь контейнера
      - ../frontend:/frontend
      # Монтируем кэш RAG, чтобы не собирать его каждый раз
      - ./chroma_db:/app/chroma_db
      # Монтируем данные
      - ./data:/app/data
      - ./datamart:/app/datamart
    environment:
      # Прокидываем переменные из .env
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    # Указываем, что папка frontend ищется по пути /frontend
    working_dir: /app